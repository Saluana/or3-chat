name: Dependency migration verification

on:
  push:
    branches:
      - automation/deps-2026-09-04

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/deps-2026-09-04
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply compatibility migrations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          # Make lint real instead of a placeholder.
          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['lint'] = 'eslint .'
          package_path.write_text(json.dumps(package, indent=4) + '\n')

          # OpenRouter SDK 1.x removed ChatError. Preserve the normalized chat
          # fallback using the SDK's new generic default HTTP error type.
          errors_path = Path('shared/openrouter/errors.ts')
          text = errors_path.read_text()
          text = text.replace('    ChatError,\n', '    OpenRouterDefaultError,\n')
          old = '''    if (error instanceof ChatError) {\n        const errData = error.error;\n        return {\n            code: 'ERR_CHAT',\n            message: errData.message || 'Chat request failed.',\n            status: 400,\n            retryable: false,\n            raw: error,\n        };\n    }\n'''
          new = '''    if (error instanceof OpenRouterDefaultError) {\n        let message = error.message || 'Chat request failed.';\n\n        try {\n            const body = JSON.parse(error.body) as {\n                error?: { message?: string };\n                message?: string;\n            };\n            message = body.error?.message || body.message || message;\n        } catch {\n            // Non-JSON error bodies are already represented by error.message.\n        }\n\n        return {\n            code: 'ERR_CHAT',\n            message,\n            status: error.statusCode,\n            retryable:\n                error.statusCode === 408 ||\n                error.statusCode === 429 ||\n                error.statusCode >= 500,\n            raw: error,\n        };\n    }\n'''
          if old not in text:
              raise SystemExit('ChatError normalization block not found')
          errors_path.write_text(text.replace(old, new))

          # Vitest 5 rejects vi.mock declarations hidden inside functions because
          # vi.mock is hoisted regardless. Register them explicitly at module scope.
          helper_path = Path('tests/utils/sidebar-test-helpers.ts')
          text = helper_path.read_text()
          start_marker = '/**\n * Mocks common composables used in sidebar tests\n */\nexport function mockSidebarComposables() {'
          start = text.index(start_marker)
          end_marker = '\n}\n\n/**\n * Sets up a complete test environment for sidebar tests\n */'
          end = text.index(end_marker, start) + 2
          mocks = '''// Vitest hoists vi.mock calls, so these declarations must live at module scope.\nvi.mock('~/composables/sidebar/useSidebarSearch', () => ({\n    useSidebarSearch: () => ({\n        query: ref(''),\n        threadResults: ref([]),\n        projectResults: ref([]),\n        documentResults: ref([]),\n    }),\n}));\n\nvi.mock('~/composables/sidebar/useActiveSidebarPage', () => ({\n    useActiveSidebarPage: () => ({\n        activePageId: ref('sidebar-home'),\n        activePageDef: ref({ id: 'sidebar-home', usesDefaultHeader: true }),\n        setActivePage: vi.fn().mockResolvedValue(true),\n        resetToDefault: vi.fn().mockResolvedValue(true),\n    }),\n}));\n\nvi.mock('~/db', () => ({\n    db: {\n        threads: {\n            orderBy: () => ({\n                reverse: () => ({\n                    filter: () => ({ toArray: async () => [] }),\n                }),\n            }),\n        },\n        projects: {\n            orderBy: () => ({\n                reverse: () => ({\n                    filter: () => ({ toArray: async () => [] }),\n                }),\n            }),\n        },\n        posts: {\n            where: () => ({\n                equals: () => ({\n                    and: () => ({ toArray: async () => [] }),\n                }),\n            }),\n        },\n    },\n    upsert: vi.fn(),\n    del: vi.fn(),\n    create: vi.fn(),\n}));\n\nvi.mock('dexie', () => ({\n    liveQuery: () => ({\n        subscribe: () => ({ unsubscribe() {} }),\n    }),\n}));\n\n/**\n * Kept for backwards compatibility with existing tests. Mocks are registered\n * at module scope because Vitest hoists vi.mock calls.\n */\nexport function mockSidebarComposables() {}'''
          helper_path.write_text(text[:start] + mocks + text[end:])

          # jsdom 30 exposes window.document as a read-only accessor. Use the real
          # jsdom CSSStyleDeclaration and spy on its methods instead of replacing it.
          bg_path = Path('app/core/theme/__tests__/backgrounds.test.ts')
          text = bg_path.read_text()
          text = text.replace('    let originalDocument: Document;\n', '')
          old_before = '''    beforeEach(() => {\n        originalDocument = global.document;\n        mockResolveToken = vi.fn(async (token: string) => {\n            if (token.startsWith('internal-file://')) return null;\n            return token;\n        });\n\n        // Create minimal DOM mock\n        const mockStyle = new Map<string, string>();\n        const styleApi = {\n            setProperty: vi.fn((key: string, value: string) => {\n                mockStyle.set(key, value);\n            }),\n            getPropertyValue: vi.fn((key: string) => mockStyle.get(key) || ''),\n            removeProperty: vi.fn((key: string) => {\n                mockStyle.delete(key);\n                return '';\n            }),\n        };\n\n        global.document = {\n            documentElement: {\n                style: styleApi,\n            },\n        } as any;\n    });\n\n    afterEach(() => {\n        global.document = originalDocument;\n        vi.clearAllMocks();\n    });\n'''
          new_before = '''    beforeEach(() => {\n        mockResolveToken = vi.fn(async (token: string) => {\n            if (token.startsWith('internal-file://')) return null;\n            return token;\n        });\n\n        document.documentElement.removeAttribute('style');\n        vi.spyOn(document.documentElement.style, 'setProperty');\n        vi.spyOn(document.documentElement.style, 'removeProperty');\n    });\n\n    afterEach(() => {\n        document.documentElement.removeAttribute('style');\n        vi.restoreAllMocks();\n    });\n'''
          if old_before not in text:
              raise SystemExit('backgrounds document mock block not found')
          bg_path.write_text(text.replace(old_before, new_before))

          # Vite 8's native config loader no longer supports CommonJS __dirname.
          vitest_path = Path('vitest.config.ts')
          text = vitest_path.read_text().replace('__dirname', 'import.meta.dirname')
          vitest_path.write_text(text)
          PY

          bun add -d vue-tsc@latest
          bun install

      - name: Verify migrations
        id: verify
        shell: bash
        run: |
          set +e
          bun run type-check
          TYPECHECK=$?
          bun run lint
          LINT=$?
          bun run test
          TEST=$?
          bun run build
          BUILD=$?
          echo "typecheck=$TYPECHECK" >> "$GITHUB_OUTPUT"
          echo "lint=$LINT" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "### Migration verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- type-check: $TYPECHECK" >> "$GITHUB_STEP_SUMMARY"
          echo "- lint: $LINT" >> "$GITHUB_STEP_SUMMARY"
          echo "- test: $TEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- build: $BUILD" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit migration changes
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-migration.yml
          git add package.json bun.lock shared/openrouter/errors.ts tests/utils/sidebar-test-helpers.ts app/core/theme/__tests__/backgrounds.test.ts vitest.config.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: migrate upgraded dependency integrations"
            git push origin HEAD:automation/deps-2026-09-04
          fi

      - name: Fail on verification errors
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.verify.outputs.typecheck }}" != "0" ] || \
             [ "${{ steps.verify.outputs.lint }}" != "0" ] || \
             [ "${{ steps.verify.outputs.test }}" != "0" ] || \
             [ "${{ steps.verify.outputs.build }}" != "0" ]; then
            exit 1
          fi
