name: Qualify OR3 Cloud Candidate

# Run this manually on the exact branch/commit intended for release. This
# workflow publishes only version+source-qualified candidate evidence. It can
# never create a release tag, a public version image, or an npm publication.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact unused release version from packages/or3-cloud/package.json
        required: true
        type: string

concurrency:
  group: qualify-or3-cloud-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve checked-out source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11.6.2
      - run: bun install --frozen-lockfile
      - name: Prove clean source and run the complete preflight
        env:
          VERSION: ${{ inputs.version }}
        run: bun run release:prepare -- --version "$VERSION" --registry --full
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable candidate names and reject reuse
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          candidate="ghcr.io/saluana/or3-chat:candidate-$VERSION-$SOURCE_SHA"
          operator="ghcr.io/saluana/or3-chat:candidate-operator-$VERSION-$SOURCE_SHA"
          evidence="ghcr.io/saluana/or3-chat:candidate-evidence-$VERSION-$SOURCE_SHA"
          if docker manifest inspect "$candidate" >/dev/null 2>&1; then
            echo "$candidate already exists; candidate identities are single-use."
            exit 1
          fi
          if docker manifest inspect "$evidence" >/dev/null 2>&1; then
            echo "$evidence already exists; candidate identities are single-use."
            exit 1
          fi
          if docker manifest inspect "$operator" >/dev/null 2>&1; then
            echo "$operator already exists; candidate identities are single-use."
            exit 1
          fi
          echo "image=$candidate" >> "$GITHUB_OUTPUT"
          echo "operator=$operator" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
      - name: Build the candidate image once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.candidate.outputs.image }}
          provenance: true
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            SSR_AUTH_ENABLED=true
            AUTH_PROVIDER=basic-auth
            OR3_GUEST_ACCESS_ENABLED=false
            OR3_AUTH_REGISTRATION_MODE=invite_only
            OR3_AUTH_AUTO_PROVISION=false
            OR3_SYNC_ENABLED=true
            OR3_SYNC_PROVIDER=sqlite
            OR3_STORAGE_ENABLED=true
            NUXT_PUBLIC_STORAGE_PROVIDER=fs
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the dedicated dashboard operator runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: dashboard-operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.candidate.outputs.operator }}
          provenance: true
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Verify manifest and anonymous pull
        id: image
        env:
          OR3_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$OR3_IMAGE")"
          grep -q 'linux/amd64' <<<"$inspect"
          grep -q 'linux/arm64' <<<"$inspect"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspect")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
          docker pull --platform linux/amd64 "$OR3_IMAGE"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify dedicated operator manifest
        id: operator-image
        env:
          OR3_OPERATOR_IMAGE: ${{ steps.candidate.outputs.operator }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$OR3_OPERATOR_IMAGE")"
          grep -q 'linux/amd64' <<<"$inspect"
          grep -q 'linux/arm64' <<<"$inspect"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspect")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
          docker pull --platform linux/amd64 "$OR3_OPERATOR_IMAGE"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind and pack the operator to the qualified image digest
        id: pack
        working-directory: packages/or3-cloud
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          OPERATOR_IMAGE_DIGEST: ${{ steps.operator-image.outputs.digest }}
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm pkg set "or3Cloud.imageDigest=$IMAGE_DIGEST"
          npm pkg set "or3Cloud.operatorImageDigest=$OPERATOR_IMAGE_DIGEST"
          npm pkg set "or3Cloud.sourceRevision=$SOURCE_REVISION"
          node -e 'const p=require("./package.json"); if(p.version!==process.env.VERSION||p.or3Cloud?.imageDigest!==process.env.IMAGE_DIGEST||p.or3Cloud?.operatorImageDigest!==process.env.OPERATOR_IMAGE_DIGEST||p.or3Cloud?.sourceRevision!==process.env.SOURCE_REVISION)process.exit(1)'
          bun run check
          mkdir -p "$GITHUB_WORKSPACE/release-artifact"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifact"
          tarball="$GITHUB_WORKSPACE/release-artifact/or3-cloud-$VERSION.tgz"
          test -f "$tarball"
          tar -tzf "$tarball" | grep -qx 'package/LICENSE'
          packed_digest="$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).or3Cloud?.imageDigest||""))')"
          test "$packed_digest" = "$IMAGE_DIGEST"
          packed_operator_digest="$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).or3Cloud?.operatorImageDigest||""))')"
          test "$packed_operator_digest" = "$OPERATOR_IMAGE_DIGEST"
          packed_source_revision="$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).or3Cloud?.sourceRevision||""))')"
          test "$packed_source_revision" = "$SOURCE_REVISION"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Check documentation against the exact tarball
        env:
          CLOUD_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun run check:docs -- --cloud-tarball "$CLOUD_TARBALL"
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@d8a2c0130026bf585de5c176ab8f7ce62d75bf04
        with:
          syft-version: v1.40.1
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
      - name: Scan both runtime architectures
        env:
          OR3_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          (cd release-artifact && node "$GITHUB_WORKSPACE/scripts/release/scan-image.mjs" "$OR3_IMAGE" \
            --platform linux/amd64 --syft "${{ steps.syft.outputs.cmd }}" --out release-evidence-amd64.json)
          (cd release-artifact && node "$GITHUB_WORKSPACE/scripts/release/scan-image.mjs" "$OR3_IMAGE" \
            --platform linux/arm64 --syft "${{ steps.syft.outputs.cmd }}" --out release-evidence-arm64.json)
      - name: Exercise upgrade, rollback, persistence, and production verification
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          CANDIDATE_OPERATOR_IMAGE: ${{ steps.candidate.outputs.operator }}
          CANDIDATE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          managed="$RUNNER_TEMP/or3-cloud-candidate"
          previous_version="$(npm view @or3/cloud version)"
          compose_args() {
            local args=(--project-directory "$managed" --env-file "$managed/.env" -f "$managed/compose.yaml")
            if [ -f "$managed/compose.operator.yaml" ] && grep -q "^OR3_DASHBOARD_UPDATES_ENABLED='true'$" "$managed/.env"; then
              args+=(-f "$managed/compose.operator.yaml")
            fi
            printf '%s\n' "${args[@]}"
          }
          cleanup() {
            if [ -f "$managed/.env" ] && [ -f "$managed/compose.yaml" ]; then
              mapfile -t args < <(compose_args)
              docker compose "${args[@]}" down --volumes --remove-orphans 2>/dev/null || true
            fi
          }
          diagnostics() {
            if [ -f "$managed/.env" ] && [ -f "$managed/compose.yaml" ]; then
              mapfile -t args < <(compose_args)
              docker compose "${args[@]}" ps -a || true
              docker compose "${args[@]}" logs --tail=200 || true
            fi
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then diagnostics; fi; cleanup; exit "$status"' EXIT

          docker image rm "$CANDIDATE_IMAGE" 2>/dev/null || true
          docker pull --platform linux/amd64 "$CANDIDATE_IMAGE"
          npx --yes "@or3/cloud@$previous_version" init "$managed" --local --port 3017 --admin-email smoke@example.com
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" write)
          (cd "$managed" && npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 verify)

          (cd "$managed" && OR3_CLOUD_TEST_IMAGE="$CANDIDATE_IMAGE" OR3_CLOUD_TEST_OPERATOR_IMAGE="$CANDIDATE_OPERATOR_IMAGE" OR3_EXPECTED_OPERATOR_IMAGE_DIGEST="${{ steps.operator-image.outputs.digest }}" \
            npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 update --to "${{ inputs.version }}")
          # Exercise the actual privileged bridge from the unprivileged app
          # container. The candidate itself is intentionally not published to
          # npm yet, so this cannot start a synthetic release; status and an
          # invalid /start prove the mounted Unix API and input boundary.
          test -S "$managed/.or3-cloud/operator-ipc/operator.sock"
          (cd "$managed" && docker compose --env-file .env -f compose.yaml -f compose.operator.yaml exec -T or3 /nodejs/bin/node -e '
            const http=require("node:http");
            const request=(method,path,body)=>new Promise((resolve,reject)=>{const r=http.request({socketPath:"/run/or3-operator/operator.sock",method,path,headers:body?{"content-type":"application/json"}:{ }},x=>{let s="";x.on("data",c=>s+=c);x.on("end",()=>resolve({status:x.statusCode,body:s}))});r.on("error",reject);if(body)r.end(JSON.stringify(body));else r.end()});
            (async()=>{const status=await request("GET","/status");if(status.status!==200||!JSON.parse(status.body).enabled)process.exit(1);const bad=await request("POST","/start",{});if(bad.status!==400)process.exit(1)})().catch(()=>process.exit(1));')
          (cd "$managed" && npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 verify)
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)
          manifest="$(find "$managed/.or3-cloud/backups" -name manifest.json -print | sort | tail -1)"
          test -n "$manifest"
          node -e 'const m=require(process.argv[1]); if (!m.managedAssetSha256?.["compose.yaml"]) process.exit(1)' "$manifest"

          (cd "$managed" && npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 rollback --yes)
          (cd "$managed" && npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 verify)
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)

          (cd "$managed" && OR3_CLOUD_TEST_IMAGE="$CANDIDATE_IMAGE" OR3_CLOUD_TEST_OPERATOR_IMAGE="$CANDIDATE_OPERATOR_IMAGE" OR3_EXPECTED_OPERATOR_IMAGE_DIGEST="${{ steps.operator-image.outputs.digest }}" \
            npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 update --to "${{ inputs.version }}")
          (cd "$managed" && npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 verify)
          (cd "$managed" && docker compose --env-file .env -f compose.yaml restart or3)
          (cd "$managed" && npm exec --yes --package="$CANDIDATE_TARBALL" -- or3 verify)
          npx playwright install --with-deps chromium
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-browser.mjs")
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Verify arm64 runtime and SQLite native binding
        env:
          OR3_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --user 65532:65532 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m --volume /data \
            --entrypoint /bin/sh "$OR3_IMAGE" -c 'printf runtime-contract > /data/probe && tar czf /tmp/data.tgz -C /data . && find /data -mindepth 1 -delete && tar xzf /tmp/data.tgz -C /data && test -f /data/probe'
          docker run --rm --platform linux/arm64 --entrypoint /nodejs/bin/node "$OR3_IMAGE" -e \
            'const D=require("/app/.output/server/node_modules/better-sqlite3"); const d=new D(":memory:"); if(d.prepare("select 42 value").get().value!==42)process.exit(1); d.close()'
      - name: Create the immutable qualification receipt
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          CANDIDATE_OPERATOR_IMAGE: ${{ steps.candidate.outputs.operator }}
          CANDIDATE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          node scripts/release/candidate-receipt.mjs create \
            --version "${{ inputs.version }}" \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --image "$CANDIDATE_IMAGE" \
            --operator-image "$CANDIDATE_OPERATOR_IMAGE" \
            --tarball "$CANDIDATE_TARBALL" \
            --output release-artifact/candidate-receipt.json \
            --run-id "$GITHUB_RUN_ID"
      - name: Publish the receipt and exact tarball as candidate evidence
        env:
          EVIDENCE_IMAGE: ${{ steps.candidate.outputs.evidence }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/or3-cloud-evidence"
          mkdir -p "$evidence"
          cp "release-artifact/or3-cloud-${{ inputs.version }}.tgz" "$evidence/"
          cp release-artifact/candidate-receipt.json "$evidence/"
          printf '%s\n' \
            'FROM scratch' \
            'COPY candidate-receipt.json /candidate-receipt.json' \
            'COPY or3-cloud-${{ inputs.version }}.tgz /or3-cloud-${{ inputs.version }}.tgz' \
            'LABEL org.opencontainers.image.revision=${{ steps.source.outputs.sha }}' \
            'LABEL org.opencontainers.image.version=${{ inputs.version }}' \
            'CMD ["/candidate-receipt.json"]' > "$evidence/Dockerfile"
          docker build --tag "$EVIDENCE_IMAGE" "$evidence"
          docker push "$EVIDENCE_IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: or3-cloud-candidate-${{ inputs.version }}-${{ steps.source.outputs.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
