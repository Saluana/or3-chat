name: Dependency check

on:
  push:
    branches:
      - automation/deps-2026-09-04

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/deps-2026-09-04
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fix Vitest constructor mock
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/pages/images/__tests__/gallery-grid.lifecycle.test.ts')
          text = p.read_text()
          old = """        vi.stubGlobal(\n            'IntersectionObserver',\n            vi.fn(() => ({ observe, disconnect }))\n        );\n"""
          new = """        class TestIntersectionObserver {\n            readonly root = null;\n            readonly rootMargin = '';\n            readonly thresholds: readonly number[] = [];\n            observe = observe;\n            unobserve = vi.fn();\n            disconnect = disconnect;\n            takeRecords = vi.fn(() => []);\n        }\n        vi.stubGlobal('IntersectionObserver', TestIntersectionObserver);\n"""
          if old not in text:
              raise SystemExit('IntersectionObserver mock not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run type-check
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint
      - name: Test
        id: test
        continue-on-error: true
        run: bun run test
      - name: Build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Commit fix and remove helper workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-check.yml
          git add app/pages/images/__tests__/gallery-grid.lifecycle.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: update Vitest observer test mock"
            git push origin HEAD:automation/deps-2026-09-04
          fi
      - name: Report
        if: always()
        shell: bash
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "lint=${{ steps.lint.outcome }}"
          echo "test=${{ steps.test.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.lint.outcome }}" != "success" ] || [ "${{ steps.test.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
