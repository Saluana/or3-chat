name: Temporary dependency final verification

on:
  push:
    branches:
      - chore/dependency-upkeep-2026-09-18

permissions:
  contents: read

env:
  CI: '1'
  SSR_AUTH_ENABLED: 'true'
  AUTH_PROVIDER: basic-auth
  OR3_AUTH_PROVIDER: basic-auth
  OR3_GUEST_ACCESS_ENABLED: 'false'
  OR3_AUTH_REGISTRATION_MODE: invite_only
  OR3_AUTH_AUTO_PROVISION: 'false'
  OR3_BASIC_AUTH_JWT_SECRET: ${{ github.sha }}
  OR3_BASIC_AUTH_DB_PATH: .data/or3-basic-auth.sqlite
  OR3_SYNC_ENABLED: 'true'
  OR3_CLOUD_SYNC_ENABLED: 'true'
  OR3_SYNC_PROVIDER: sqlite
  OR3_SQLITE_DB_PATH: .data/sync.sqlite
  OR3_STORAGE_ENABLED: 'true'
  OR3_CLOUD_STORAGE_ENABLED: 'true'
  NUXT_PUBLIC_STORAGE_PROVIDER: fs
  OR3_STORAGE_FS_ROOT: ${{ github.workspace }}/.data/storage
  OR3_STORAGE_FS_TOKEN_SECRET: ${{ github.sha }}
  OR3_BACKGROUND_STREAMING_ENABLED: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run type-check
      - name: Provider compatibility
        run: bun run test:cloud:provider-compatibility
      - name: Production build
        run: bun run build
      - name: Remaining outdated dependencies
        run: bun outdated || true
