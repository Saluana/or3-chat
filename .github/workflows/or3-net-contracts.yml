name: OR3 Net Consumer Contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/composables/or3-net/**'
      - 'app/components/dashboard/or3-net/**'
      - 'server/api/or3-net/**'
      - 'tests/contracts/**'
      - 'planning/or3-net/**'
      - '.github/workflows/or3-net-contracts.yml'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'app/composables/or3-net/**'
      - 'app/components/dashboard/or3-net/**'
      - 'server/api/or3-net/**'
      - 'tests/contracts/**'
      - 'planning/or3-net/**'
      - '.github/workflows/or3-net-contracts.yml'
      - 'package.json'
      - 'bun.lock'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run OR3 Net contract suite
        run: bunx vitest run app/composables/or3-net/__tests__/contracts.test.ts tests/contracts/or3-net-api.contract.test.ts
