name: Dependency upkeep temp

on:
  push:
    branches:
      - chore/dependency-upkeep-2026-09-11

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-upkeep-2026-09-11
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply safe dependency migrations
        shell: bash
        run: |
          bun add --exact streamdown-vue@1.0.32
          bun add tiptap-markdown@0.9.0
          bun add -d vue-tsc@3.3.11
          bun -e 'const p = await Bun.file("package.json").json(); p.scripts.lint = "eslint ."; await Bun.write("package.json", JSON.stringify(p, null, 4) + "\n")'

      - name: Frozen install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Commit verified updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: complete dependency upkeep"
          git push origin HEAD:chore/dependency-upkeep-2026-09-11
