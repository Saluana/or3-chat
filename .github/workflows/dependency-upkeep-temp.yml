name: Dependency upkeep temp

on:
  push:
    branches:
      - chore/dependency-upkeep-2026-09-11

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-upkeep-2026-09-11

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify
        shell: bash
        run: |
          set +e
          bun outdated > /tmp/outdated.log 2>&1
          outdated_status=$?
          bun install --frozen-lockfile > /tmp/install.log 2>&1
          install_status=$?
          bun run type-check > /tmp/typecheck.log 2>&1
          typecheck_status=$?
          bunx eslint . > /tmp/lint.log 2>&1
          lint_status=$?
          bun run test > /tmp/test.log 2>&1
          test_status=$?
          bun run build > /tmp/build.log 2>&1
          build_status=$?

          echo "DEPENDENCY UPKEEP DIAGNOSTICS"
          echo "install=$install_status typecheck=$typecheck_status lint=$lint_status test=$test_status build=$build_status outdated_exit=$outdated_status"
          echo "===== OUTDATED ====="
          cat /tmp/outdated.log
          echo "===== INSTALL ====="
          cat /tmp/install.log
          echo "===== TYPECHECK ====="
          cat /tmp/typecheck.log
          echo "===== LINT ====="
          cat /tmp/lint.log
          echo "===== TEST TAIL ====="
          tail -n 250 /tmp/test.log
          echo "===== BUILD TAIL ====="
          tail -n 250 /tmp/build.log

          if [ "$install_status" -ne 0 ] || [ "$typecheck_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi
