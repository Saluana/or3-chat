name: Dependency upkeep

on:
  push:
    branches:
      - automation/deps-2026-09-04

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: automation/deps-2026-09-04
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify baseline install
        run: bun install --frozen-lockfile

      - name: Update direct dependencies
        run: bunx npm-check-updates@latest -u

      - name: Refresh lockfile
        run: bun install

      - name: Verify updated project
        id: verify
        shell: bash
        run: |
          set +e
          bun run type-check
          TYPECHECK=$?
          bun run lint
          LINT=$?
          bun run test
          TEST=$?
          bun run build
          BUILD=$?
          echo "typecheck=$TYPECHECK" >> "$GITHUB_OUTPUT"
          echo "lint=$LINT" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "### Dependency upkeep verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- type-check: $TYPECHECK" >> "$GITHUB_STEP_SUMMARY"
          echo "- lint: $LINT" >> "$GITHUB_STEP_SUMMARY"
          echo "- test: $TEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- build: $BUILD" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit dependency updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-upkeep.yml
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: update dependencies"
            git push origin HEAD:automation/deps-2026-09-04
          fi

      - name: Fail if verification failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.verify.outputs.typecheck }}" != "0" ] || \
             [ "${{ steps.verify.outputs.lint }}" != "0" ] || \
             [ "${{ steps.verify.outputs.test }}" != "0" ] || \
             [ "${{ steps.verify.outputs.build }}" != "0" ]; then
            exit 1
          fi
