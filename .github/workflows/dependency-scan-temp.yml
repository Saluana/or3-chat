name: Temporary dependency lint compatibility

on:
  push:
    branches:
      - chore/dependency-upkeep-2026-09-18

permissions:
  contents: write

jobs:
  adjust:
    if: github.event.head_commit.message == '[Chore] Restore lint compatibility'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore compatible TypeScript ESLint versions
        run: bun add -d '@typescript-eslint/eslint-plugin@^8.65.0' '@typescript-eslint/parser@^8.65.0'
      - name: Commit lockfile adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m '[Deps] Keep TypeScript ESLint on compatible release'
          git push
