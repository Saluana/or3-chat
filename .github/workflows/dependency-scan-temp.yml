name: Temporary dependency updater

on:
  push:
    branches:
      - chore/dependency-upkeep-2026-09-18

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == '[Chore] Run dependency updater'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Update runtime dependencies
        run: |
          bun add \
            '@noble/hashes@^2.4.0' \
            '@nuxt/ui@4.11.1' \
            '@openrouter/sdk@^1.2.145' \
            '@vueuse/core@14.4.0' \
            'dexie@~4.4.6' \
            'dexie-export-import@^4.4.1' \
            'nuxt@4.5.2' \
            'reka-ui@2.10.4' \
            'vue@3.5.43' \
            'vue-router@^5.3.1' \
            'zod@^4.6.5'
      - name: Update development dependencies
        run: |
          bun add -d \
            '@iconify-json/carbon@^1.2.27' \
            '@iconify-json/lucide@^1.2.134' \
            '@iconify-json/pixelarticons@^1.2.9' \
            '@iconify-json/tabler@^1.2.38' \
            '@playwright/test@^1.63.0' \
            '@tailwindcss/typography@^0.5.20' \
            '@types/node@^24.13.5' \
            '@types/semver@^7.8.0' \
            '@typescript-eslint/eslint-plugin@^8.70.0' \
            '@typescript-eslint/parser@^8.70.0' \
            '@vitejs/plugin-vue@6.0.9' \
            '@vitest/coverage-v8@4.1.11' \
            '@vue/test-utils@^2.5.1' \
            'convex@1.46.0' \
            'eslint@^9.39.5' \
            'tsx@^4.23.13' \
            'vite@8.3.0' \
            'vitest@4.1.11' \
            'vue-tsc@3.3.11'
      - name: Commit dependency updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m '[Deps] Refresh stable dependencies'
          git push
