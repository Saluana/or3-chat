name: Temporary dependency verification

on:
  push:
    branches:
      - chore/dependency-upkeep-2026-09-18

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == '[Chore] Verify dependency updates'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      SSR_AUTH_ENABLED: 'true'
      AUTH_PROVIDER: basic-auth
      OR3_AUTH_PROVIDER: basic-auth
      OR3_GUEST_ACCESS_ENABLED: 'false'
      OR3_AUTH_REGISTRATION_MODE: invite_only
      OR3_AUTH_AUTO_PROVISION: 'false'
      OR3_BASIC_AUTH_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      OR3_BASIC_AUTH_DB_PATH: .data/or3-basic-auth.sqlite
      OR3_SYNC_ENABLED: 'true'
      OR3_CLOUD_SYNC_ENABLED: 'true'
      OR3_SYNC_PROVIDER: sqlite
      OR3_SQLITE_DB_PATH: .data/sync.sqlite
      OR3_STORAGE_ENABLED: 'true'
      OR3_CLOUD_STORAGE_ENABLED: 'true'
      NUXT_PUBLIC_STORAGE_PROVIDER: fs
      OR3_STORAGE_FS_ROOT: ${{ github.workspace }}/.data/storage
      OR3_STORAGE_FS_TOKEN_SECRET: ci-only-storage-secret-0123456789abcdef0123456789abcdef
      OR3_BACKGROUND_STREAMING_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run type-check
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint
      - name: Core tests
        id: tests
        continue-on-error: true
        run: bun run test
      - name: Provider compatibility
        id: providers
        continue-on-error: true
        run: bun run test:cloud:provider-compatibility
      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Remaining outdated dependencies
        run: bun outdated || true
      - name: Require critical checks
        run: |
          echo 'typecheck=${{ steps.typecheck.outcome }}'
          echo 'lint=${{ steps.lint.outcome }}'
          echo 'tests=${{ steps.tests.outcome }}'
          echo 'providers=${{ steps.providers.outcome }}'
          echo 'build=${{ steps.build.outcome }}'
          if [ '${{ steps.typecheck.outcome }}' != 'success' ] || \
             [ '${{ steps.tests.outcome }}' != 'success' ] || \
             [ '${{ steps.providers.outcome }}' != 'success' ] || \
             [ '${{ steps.build.outcome }}' != 'success' ]; then
            exit 1
          fi
