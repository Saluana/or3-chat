name: Release create-or3-chat

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified create-or3-chat tarball
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  creator-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
        working-directory: packages/create-or3-chat

  qualify:
    needs: creator-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11

      - name: Verify published first-party dependencies
        run: |
          node packages/create-or3-chat/scripts/build-template.mjs
          node scripts/release/check-create-or3-chat.mjs --registry

      - name: Generate npm and Bun lockfiles
        run: |
          node packages/create-or3-chat/scripts/build-template.mjs --generate-locks
          node scripts/release/check-create-or3-chat.mjs --require-locks

      - name: Pack immutable creator artifact
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
        working-directory: packages/create-or3-chat

      - name: Scaffold from packed artifact
        run: |
          mkdir -p "$RUNNER_TEMP/creator-package"
          tar -xzf "$RUNNER_TEMP"/create-or3-chat-*.tgz -C "$RUNNER_TEMP/creator-package"
          node "$RUNNER_TEMP/creator-package/package/dist/index.mjs" "$RUNNER_TEMP/or3-npm" --yes --skip-install --no-git
          node "$RUNNER_TEMP/creator-package/package/dist/index.mjs" "$RUNNER_TEMP/or3-bun" --yes --skip-install --no-git --pm bun

      - name: npm template smoke
        run: |
          npm install
          npm run build
        working-directory: ${{ runner.temp }}/or3-npm

      - name: Bun template smoke
        run: |
          bun install
          bun run build
        working-directory: ${{ runner.temp }}/or3-bun

      - name: Docker smoke
        run: |
          npm run setup -- --fast --mode self-hosted --target configure --cli --pm npm
          docker compose -f compose.yaml config
          OR3_PUBLIC_DOMAIN=chat.example.test docker compose -f compose.yaml -f compose.public.yaml config
          docker compose -f compose.yaml up --build -d
          for attempt in $(seq 1 120); do
            curl --fail --silent "http://127.0.0.1:3000/api/health?deep=true" && break
            sleep 1
          done
          curl --fail "http://127.0.0.1:3000/api/health?deep=true"
          node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" write
          docker compose -f compose.yaml restart or3
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://127.0.0.1:3000/api/health?deep=true" && break
            sleep 1
          done
          curl --fail "http://127.0.0.1:3000/api/health?deep=true"
          node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify
          docker compose -f compose.yaml down
        working-directory: ${{ runner.temp }}/or3-npm

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: npm publish "$RUNNER_TEMP"/create-or3-chat-*.tgz --access public
