name: PR checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, or3-cloud]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  core:
    name: Core and affected contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # paths-filter compares push events against the repository's default
      # branch. A depth-1 checkout makes it repeatedly deepen both refs and can
      # fail before any project check runs; fetch the history once instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            banned_imports:
              - 'app/**'
              - 'server/**'
            cloud:
              - '.dockerignore'
              - 'Dockerfile'
              - 'compose*.yaml'
              - 'modules/**'
              - 'packages/or3-cloud/**'
              - 'packages/create-or3-chat/first-party-versions.json'
              - 'scripts/docker/**'
              - 'scripts/release/**'
              - '.github/workflows/extended-validation.yml'
              - '.github/workflows/release-cloud-candidate.yml'
              - '.github/workflows/release-cloud.yml'
            plugin_runtime:
              - 'app/composables/**'
              - 'app/core/hooks/**'
              - 'app/plugins/examples/**'
              - 'app/utils/chat/**'
              - 'server/hooks/**'
              - 'server/utils/chat/**'
              - 'shared/hooks/**'
              - 'shared/plugins/**'
              - 'scripts/plugin-runtime/**'
              - 'scripts/__tests__/plugin-runtime-compatibility-snapshots.test.ts'
              - 'scripts/__tests__/plugin-runtime-example-fixtures.test.ts'
              - 'tests/plugin-runtime/**'
              - 'planning/complete/plugin-runtime-v2/**'
              - 'nuxt.config.ts'
              - 'vitest.config.ts'
            perf_search:
              - 'app/components/search/**'
              - 'app/composables/search/**'
              - 'app/core/search/command-palette/**'
              - 'scripts/performance/report.ts'
            perf_sync:
              - 'app/core/sync/**'
              - 'shared/sync/**'
            perf_workspace:
              - 'scripts/performance/populated-workspace.perf.ts'
              - 'scripts/performance/report.ts'
            perf_browser:
              - 'tests/e2e/performance-budgets.e2e.ts'
            perf_build:
              - 'Dockerfile'
              - 'packages/or3-cloud/**'
              - 'server/admin/update/**'
              - 'server/api/admin/update/**'
              - 'app/components/admin/system/AdminSystemUpdateCard.vue'
              - 'scripts/performance/production-build.perf.ts'
              - 'scripts/performance/report.ts'
              - 'scripts/__tests__/production-build-performance.test.ts'
              - 'nuxt.config.ts'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check banned provider imports
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.banned_imports == 'true'
        run: bash scripts/check-banned-imports.sh
      - name: Check documentation
        run: bun run check:docs
      - name: Lint changed source files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha...HEAD" -- \
              '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.vue'
          )
          if ((${#files[@]} == 0)); then
            echo 'No changed JavaScript or TypeScript source files to lint.'
          else
            bun run lint:changed -- "${files[@]}"
          fi
      # The repository-wide lint baseline currently has existing violations in
      # legacy/generated trees. Keep reporting them without blocking PRs while
      # the required incremental gate above protects changed source files.
      - name: Report full-project ESLint baseline (advisory)
        continue-on-error: true
        run: bun run lint
      - name: Type-check application
        env:
          CI: '1'
          AUTH_PROVIDER: basic-auth
          OR3_AUTH_PROVIDER: basic-auth
          OR3_GUEST_ACCESS_ENABLED: 'false'
          OR3_AUTH_REGISTRATION_MODE: invite_only
          OR3_AUTH_AUTO_PROVISION: 'false'
          OR3_SYNC_ENABLED: 'true'
          OR3_CLOUD_SYNC_ENABLED: 'true'
          OR3_SYNC_PROVIDER: sqlite
          OR3_STORAGE_ENABLED: 'true'
          OR3_CLOUD_STORAGE_ENABLED: 'true'
          NUXT_PUBLIC_STORAGE_PROVIDER: fs
        run: bun run type-check
      - name: Run core tests
        run: bun run test
      - name: Run script tests
        run: bun run test:scripts
      - name: Run release policy tests
        run: bun run test:release-policy
      - name: Run skills package tests
        working-directory: packages/or3-skills
        run: bun run test:all
      - name: Check Cloud package contracts
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.cloud == 'true'
        run: |
          bun run release:cloud:check
          bun run cloud:package:check
      - name: Prepare plugin declarations
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.plugin_runtime == 'true'
        run: bunx nuxt prepare
      - name: Check plugin compatibility ledger and snapshots
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.plugin_runtime == 'true'
        run: bun run plugin-runtime:compatibility:check
      - name: Run plugin compatibility contracts
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.plugin_runtime == 'true'
        run: bun run test:plugin-compatibility
      - name: Compile plugin compatibility fixtures
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.plugin_runtime == 'true'
        run: |
          bun run plugin-runtime:examples:check
          bun run plugin-runtime:external-v1:check
      - name: Check command-palette performance budget (advisory)
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_search == 'true'
        run: bun run command-palette:benchmarks:check
      - name: Check sync performance budgets (advisory)
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_sync == 'true'
        run: bun run sync:benchmarks:check
      - name: Check populated-workspace budget (advisory)
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_workspace == 'true'
        run: bun run performance:workspace:check
      - name: Install Chromium for affected browser budget
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_browser == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Check browser performance budgets (advisory)
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_browser == 'true'
        run: bun run performance:browser:check
      - name: Build affected production application
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_build == 'true'
        run: bun run build
      - name: Check production build budget (advisory)
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_build == 'true'
        run: bun run performance:production-build:check
      - name: Upload affected performance reports
        if: always() && (github.event_name == 'workflow_dispatch' || steps.changes.outputs.perf_search == 'true' || steps.changes.outputs.perf_sync == 'true' || steps.changes.outputs.perf_workspace == 'true' || steps.changes.outputs.perf_browser == 'true' || steps.changes.outputs.perf_build == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: affected-performance-${{ github.sha }}
          path: |
            output/performance/*.json
            output/playwright/*.json
            test-results/**
          if-no-files-found: warn
          retention-days: 14
