name: Dependency verification pass 2

on:
  push:
    branches:
      - automation/deps-2026-09-04

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/deps-2026-09-04
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply compatibility fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/core/theme/__tests__/user-overrides.test.ts')
          text = p.read_text()
          old = '''    // Mock MutationObserver\n    global.MutationObserver = vi.fn().mockImplementation(() => ({\n        observe: vi.fn(),\n        disconnect: vi.fn(),\n    }));\n'''
          new = '''    // Vitest 5 requires constructor mocks to be constructable functions/classes.\n    global.MutationObserver = class MockMutationObserver {\n        observe = vi.fn();\n        disconnect = vi.fn();\n        takeRecords = vi.fn(() => []);\n    } as unknown as typeof MutationObserver;\n'''
          if old not in text:
              raise SystemExit('MutationObserver mock block not found')
          p.write_text(text.replace(old, new))
          PY

          # TypeScript 7 uses the new native compiler API. vue-tsc and
          # typescript-eslint still require the classic TS 6 API.
          bun add -d typescript@6.0.3
          bun install

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run type-check

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Test
        id: test
        continue-on-error: true
        run: bun run test

      - name: Build
        id: build
        continue-on-error: true
        env:
          NITRO_DEBUG: "1"
        run: bun run build

      - name: Commit fixes
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-verification-2.yml
          git add package.json bun.lock app/core/theme/__tests__/user-overrides.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: keep dependency toolchain on TypeScript 6"
            git push origin HEAD:automation/deps-2026-09-04
          fi

      - name: Report status
        if: always()
        shell: bash
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "lint=${{ steps.lint.outcome }}"
          echo "test=${{ steps.test.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
