name: Release OR3 Cloud

# A tag cannot build a new candidate. It may only promote and publish evidence
# previously created for this exact version and source commit.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-or3-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      digest: ${{ steps.promote.outputs.digest }}
      operator_digest: ${{ steps.promote.outputs.operator_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag and candidate identity
        id: identity
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/or3-cloud/package.json").version')"
          root_version="$(node -p 'require("./package.json").version')"
          lock_version="$(node -p 'require("./package-lock.json").version')"
          cli_version="$(sed -n "s/^export const PACKAGE_VERSION = '\([^']*\)';/\1/p" packages/or3-cloud/src/cli.ts)"
          source="$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$root_version" = "$version"
          test "$lock_version" = "$version"
          test "$cli_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "candidate=ghcr.io/saluana/or3-chat:candidate-$version-$source" >> "$GITHUB_OUTPUT"
          echo "candidate_operator=ghcr.io/saluana/or3-chat:candidate-operator-$version-$source" >> "$GITHUB_OUTPUT"
          echo "evidence=ghcr.io/saluana/or3-chat:candidate-evidence-$version-$source" >> "$GITHUB_OUTPUT"
          echo "release=ghcr.io/saluana/or3-chat:$version" >> "$GITHUB_OUTPUT"
          echo "operator_release=ghcr.io/saluana/or3-chat:${version}-operator" >> "$GITHUB_OUTPUT"
      - name: Check npm registry state without republishing
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          npm_output="$(npm view "@or3/cloud@$VERSION" version 2>&1)" || npm_status=$?
          if [ "${npm_status:-0}" -eq 0 ]; then
            echo "@or3/cloud@$VERSION already exists; its exact immutable artifact will be compared with the qualification receipt before publication is skipped."
            exit 0
          fi
          if ! grep -Eq 'E404|404 Not Found|not found' <<<"$npm_output"; then
            echo "$npm_output"
            exit "${npm_status}"
          fi
      - name: Download exact candidate evidence
        env:
          EVIDENCE_IMAGE: ${{ steps.identity.outputs.evidence }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source }}
        run: |
          set -euo pipefail
          docker pull "$EVIDENCE_IMAGE"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$EVIDENCE_IMAGE")"
          evidence_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$EVIDENCE_IMAGE")"
          test "$revision" = "$SOURCE_SHA"
          test "$evidence_version" = "$VERSION"
          mkdir -p release-artifact
          container="$(docker create "$EVIDENCE_IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/candidate-receipt.json" release-artifact/candidate-receipt.json
          docker cp "$container:/or3-cloud-$VERSION.tgz" "release-artifact/or3-cloud-$VERSION.tgz"
          docker rm "$container"
          trap - EXIT
      - name: Verify candidate receipt, image, and tarball
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          node scripts/release/candidate-receipt.mjs verify \
            --version "$VERSION" \
            --image "${{ steps.identity.outputs.candidate }}" \
            --operator-image "${{ steps.identity.outputs.candidate_operator }}" \
            --receipt release-artifact/candidate-receipt.json \
            --tarball "release-artifact/or3-cloud-$VERSION.tgz"
      - name: Promote the exact qualified digest without rebuilding
        id: promote
        env:
          RELEASE_IMAGE: ${{ steps.identity.outputs.release }}
          OPERATOR_RELEASE_IMAGE: ${{ steps.identity.outputs.operator_release }}
        run: |
          set -euo pipefail
          candidate_digest="$(node -p 'require("./release-artifact/candidate-receipt.json").candidateDigest')"
          candidate_image="$(node -p 'require("./release-artifact/candidate-receipt.json").candidateImage')"
          operator_digest="$(node -p 'require("./release-artifact/candidate-receipt.json").operatorCandidateDigest')"
          operator_image="$(node -p 'require("./release-artifact/candidate-receipt.json").operatorCandidateImage')"
          if docker manifest inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            release_inspect="$(docker buildx imagetools inspect "$RELEASE_IMAGE")"
            release_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$release_inspect")"
            test "$release_digest" = "$candidate_digest" || { echo "$RELEASE_IMAGE exists with a different digest; refusing to overwrite it."; exit 1; }
          else
            docker buildx imagetools create --tag "$RELEASE_IMAGE" "$candidate_image@$candidate_digest"
          fi
          release_inspect="$(docker buildx imagetools inspect "$RELEASE_IMAGE")"
          release_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$release_inspect")"
          test "$release_digest" = "$candidate_digest"
          if docker manifest inspect "$OPERATOR_RELEASE_IMAGE" >/dev/null 2>&1; then
            operator_release_inspect="$(docker buildx imagetools inspect "$OPERATOR_RELEASE_IMAGE")"
            existing_operator_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$operator_release_inspect")"
            test "$existing_operator_digest" = "$operator_digest" || { echo "$OPERATOR_RELEASE_IMAGE exists with a different digest; refusing to overwrite it."; exit 1; }
          else
            docker buildx imagetools create --tag "$OPERATOR_RELEASE_IMAGE" "$operator_image@$operator_digest"
          fi
          operator_release_inspect="$(docker buildx imagetools inspect "$OPERATOR_RELEASE_IMAGE")"
          published_operator_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$operator_release_inspect")"
          test "$published_operator_digest" = "$operator_digest"
          echo "$release_digest" > release-artifact/digest.txt
          echo "$published_operator_digest" > release-artifact/operator-digest.txt
          echo "digest=$release_digest" >> "$GITHUB_OUTPUT"
          echo "operator_digest=$published_operator_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: or3-cloud-release-${{ steps.identity.outputs.version }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@v8
        with:
          name: or3-cloud-release-${{ needs.promote.outputs.version }}
          path: release-artifact
      - uses: docker/setup-buildx-action@v3
      - name: Re-verify promoted image and exact package
        env:
          VERSION: ${{ needs.promote.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.promote.outputs.digest }}
          EXPECTED_OPERATOR_DIGEST: ${{ needs.promote.outputs.operator_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$VERSION"
          recorded="$(tr -d '[:space:]' < release-artifact/digest.txt)"
          test "$recorded" = "$EXPECTED_DIGEST"
          receipt_digest="$(node -p 'require("./release-artifact/candidate-receipt.json").candidateDigest')"
          test "$receipt_digest" = "$EXPECTED_DIGEST"
          actual="$(docker buildx imagetools inspect "ghcr.io/saluana/or3-chat:$VERSION" | awk '$1 == "Digest:" { print $2; exit }')"
          test "$actual" = "$EXPECTED_DIGEST"
          recorded_operator="$(tr -d '[:space:]' < release-artifact/operator-digest.txt)"
          test "$recorded_operator" = "$EXPECTED_OPERATOR_DIGEST"
          actual_operator="$(docker buildx imagetools inspect "ghcr.io/saluana/or3-chat:$VERSION-operator" | awk '$1 == "Digest:" { print $2; exit }')"
          test "$actual_operator" = "$EXPECTED_OPERATOR_DIGEST"
          tarball="release-artifact/or3-cloud-$VERSION.tgz"
          expected_sha="$(node -p 'require("./release-artifact/candidate-receipt.json").tarballSha256')"
          actual_sha="$(node -e 'const fs=require("fs"),c=require("crypto"); console.log(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$tarball")"
          test "$actual_sha" = "$expected_sha"
      - name: Publish @or3/cloud or verify an exact prior publication
        env:
          VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          expected_integrity="$(node -p 'require("./release-artifact/candidate-receipt.json").tarballIntegrity')"
          published_integrity="$(npm view --json "@or3/cloud@$VERSION" dist.integrity 2>&1)" || npm_status=$?
          if [ "${npm_status:-0}" -eq 0 ] && [ -n "$published_integrity" ] && [ "$published_integrity" != "null" ]; then
            actual_integrity="$(node -e 'const s=process.argv[1]; let v; try { v=JSON.parse(s) } catch { v=s }; process.stdout.write(typeof v === "string" ? v : "")' "$published_integrity")"
            test "$actual_integrity" = "$expected_integrity" || { echo "@or3/cloud@$VERSION already exists with a different integrity; refusing to overwrite it."; exit 1; }
            echo "@or3/cloud@$VERSION is already published with the qualified immutable tarball; continuing verification."
          else
            if ! grep -Eq 'E404|404 Not Found|not found' <<<"$published_integrity"; then
              echo "$published_integrity"
              exit "${npm_status:-1}"
            fi
            npm publish "./release-artifact/or3-cloud-$VERSION.tgz" --access public
          fi
      - name: Verify exact npm and npx propagation
        env:
          VERSION: ${{ needs.promote.outputs.version }}
        run: |
          for attempt in $(seq 1 120); do
            if npm_config_prefer_online=true npm view "@or3/cloud@$VERSION" version | grep -Fx "$VERSION"; then
              if npm_config_prefer_online=true npx --yes "@or3/cloud@$VERSION" --help; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "@or3/cloud@$VERSION was not available after registry propagation retries."
          exit 1

  dashboard-lifecycle:
    needs: [promote, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Exercise the published dashboard update and rollback path
        env:
          VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          managed="$RUNNER_TEMP/or3-cloud-dashboard-release"
          minimum_source="$(npm view "@or3/cloud@$VERSION" or3Cloud.dashboardUpdateMinimumSourceVersion)"
          candidate_versions="$(npm view @or3/cloud versions --json | MINIMUM_SOURCE="$minimum_source" node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const target=process.env.VERSION,minimum=process.env.MINIMUM_SOURCE;const values=JSON.parse(s);const compare=(a,b)=>{const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<3;i+=1){if(x[i]!==y[i])return x[i]-y[i]}return 0};process.stdout.write((Array.isArray(values)?values:[values]).filter(v=>/^\d+\.\d+\.\d+$/.test(v)&&compare(v,target)<0&&compare(v,minimum)>=0).sort(compare).reverse().join("\n"))})')"
          previous_version=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            if [ "$(npm view "@or3/cloud@$candidate" or3Cloud.dashboardUpdateProtocol)" = 1 ]; then
              previous_version="$candidate"
              break
            fi
          done <<< "$candidate_versions"
          if [ -z "$previous_version" ]; then
            echo "No earlier dashboard-compatible release satisfies minimum source $minimum_source; the candidate bridge probe is the inaugural-release gate."
            exit 0
          fi
          compose_args() {
            local args=(--project-directory "$managed" --env-file "$managed/.env" -f "$managed/compose.yaml")
            if [ -f "$managed/compose.operator.yaml" ] && grep -q "^OR3_DASHBOARD_UPDATES_ENABLED='true'$" "$managed/.env"; then
              args+=(-f "$managed/compose.operator.yaml")
            fi
            printf '%s\n' "${args[@]}"
          }
          cleanup() {
            if [ -n "${driver_pid:-}" ]; then
              kill "$driver_pid" 2>/dev/null || true
              wait "$driver_pid" 2>/dev/null || true
            fi
            if [ -f "$managed/.env" ] && [ -f "$managed/compose.yaml" ]; then
              mapfile -t args < <(compose_args)
              docker compose "${args[@]}" down --volumes --remove-orphans 2>/dev/null || true
            fi
          }
          diagnostics() {
            if [ -f "$managed/.env" ] && [ -f "$managed/compose.yaml" ]; then
              mapfile -t args < <(compose_args)
              docker compose "${args[@]}" ps -a || true
              docker compose "${args[@]}" logs --tail=200 || true
            fi
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then diagnostics; fi; cleanup; exit "$status"' EXIT

          npx --yes "@or3/cloud@$previous_version" init "$managed" --local --port 3018 --admin-email dashboard-smoke@example.com
          test -S "$managed/.or3-cloud/operator-ipc/operator.sock"
          test "$(stat -c '%a' "$managed/.or3-cloud/operator-ipc")" = 710
          test "$(stat -c '%a' "$managed/.or3-cloud/operator-ipc/operator.sock")" = 660
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3018 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" write)
          node scripts/release/smoke-dashboard-update.mjs "$managed/.or3-cloud/operator-ipc/operator.sock" "$VERSION"
          (cd "$managed" && npx --yes "@or3/cloud@$VERSION" verify)
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3018 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)
          grep -q "^OR3_VERSION='$VERSION'$" "$managed/.env"

          (cd "$managed" && npx --yes "@or3/cloud@$VERSION" rollback --yes)
          (cd "$managed" && npx --yes "@or3/cloud@$previous_version" verify)
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3018 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)

          node scripts/release/smoke-dashboard-update.mjs "$managed/.or3-cloud/operator-ipc/operator.sock" "$VERSION" > "$RUNNER_TEMP/dashboard-interrupted.log" 2>&1 &
          driver_pid=$!
          observed_mutation=false
          for attempt in $(seq 1 600); do
            phase="$(node -e 'try{process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).incompleteOperation?.phase||"")}catch{}' "$managed/.or3-cloud/state.json" || true)"
            if [ "$phase" = target-mutating ]; then
              observed_mutation=true
              break
            fi
            kill -0 "$driver_pid" 2>/dev/null || break
            sleep 0.1
          done
          test "$observed_mutation" = true
          mapfile -t args < <(compose_args)
          operator_id="$(docker compose "${args[@]}" ps -q or3-operator)"
          test -n "$operator_id"
          docker kill "$operator_id"
          set +e
          wait "$driver_pid"
          driver_status=$?
          set -e
          test "$driver_status" -ne 0
          grep -Eq 'ended in failed|ended in needs_attention' "$RUNNER_TEMP/dashboard-interrupted.log"
          grep -q "^OR3_VERSION='$previous_version'$" "$managed/.env"
          (cd "$managed" && npx --yes "@or3/cloud@$previous_version" verify)
          (cd "$managed" && OR3_SMOKE_URL=http://127.0.0.1:3018 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)
