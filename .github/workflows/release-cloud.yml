name: Release OR3 Cloud

# Dispatch is QUALIFICATION-ONLY: a manual run builds and qualifies the
# candidate (typecheck, package checks, lock drift, a local amd64 image build,
# API + clean-browser smokes) but never publishes. Publication
# happens ONLY on the exact version-matching tag push (refs/tags/v*).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Job A "qualify": full qualification + immutable image promotion on tag runs.
  #
  # Resumable image-first flow:
  #   - npm is immutable: if @or3/cloud@<version> already exists, fail.
  #   - The image may already exist from a run whose npm half failed. That is a
  #     resumable state, NOT an error: source/version labels are verified and
  #     the workflow only publishes the missing npm half.
  #   - A new release is first pushed to a unique candidate tag. The public
  #     version tag is promoted only after manifest, scan, and runtime gates.
  # ---------------------------------------------------------------------------
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11.6.2
      - run: bun install --frozen-lockfile
      - name: Verify version contract
        run: bun run release:cloud:check
      - name: Read release version
        id: version
        run: |
          version="$(node -p 'require("./packages/or3-cloud/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Gate on lockfile drift
        run: bun run scripts/release/check-lock-drift.mjs
      - name: Verify fixed-profile provider dependencies
        run: bun run scripts/release/check-cloud-package.mjs --registry
      - name: Build and test Cloud CLI
        run: bun run cloud:package:check
      - name: Typecheck the production Chat app
        env:
          AUTH_PROVIDER: basic-auth
          OR3_GUEST_ACCESS_ENABLED: 'false'
          OR3_AUTH_REGISTRATION_MODE: invite_only
          OR3_AUTH_AUTO_PROVISION: 'false'
          OR3_SYNC_ENABLED: 'true'
          OR3_SYNC_PROVIDER: sqlite
          OR3_STORAGE_ENABLED: 'true'
          NUXT_PUBLIC_STORAGE_PROVIDER: fs
        run: bun run type-check
      - name: Pack Cloud CLI
        id: pack
        working-directory: packages/or3-cloud
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'or3-cloud-*.tgz' -print -quit)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Check beginner documentation and exact Cloud artifact
        env:
          CLOUD_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun run check:docs -- --cloud-tarball "$CLOUD_TARBALL"
      - name: Check canonical docs and beginner commands
        run: node scripts/release/check-docs.mjs --cloud-tarball "${{ steps.pack.outputs.tarball }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject reused npm version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm_output="$(npm view "@or3/cloud@$VERSION" version 2>&1)" || npm_status=$?
          if [ "${npm_status:-0}" -eq 0 ]; then
            echo "@or3/cloud@$VERSION already exists; choose a new version."
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found|not found' <<<"$npm_output"; then
            echo "$npm_output"
            exit "${npm_status}"
          fi
      - name: Plan immutable image release
        id: image-plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release="ghcr.io/saluana/or3-chat:$VERSION"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "qualifying_image=$release" >> "$GITHUB_OUTPUT"
            echo "release_image=$release" >> "$GITHUB_OUTPUT"
            echo "resume=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker manifest inspect "$release" >/dev/null 2>&1; then
            docker pull "$release"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$release")"
            version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$release")"
            test "$revision" = "$GITHUB_SHA" || { echo "Existing $release is not labelled with this source revision; refusing to publish npm against an unverified image."; exit 1; }
            test "$version" = "$VERSION" || { echo "Existing $release has version label $version, expected $VERSION."; exit 1; }
            echo "qualifying_image=$release" >> "$GITHUB_OUTPUT"
            echo "release_image=$release" >> "$GITHUB_OUTPUT"
            echo "resume=true" >> "$GITHUB_OUTPUT"
          else
            candidate="ghcr.io/saluana/or3-chat:candidate-$VERSION-$GITHUB_RUN_ID"
            echo "qualifying_image=$candidate" >> "$GITHUB_OUTPUT"
            echo "candidate_image=$candidate" >> "$GITHUB_OUTPUT"
            echo "release_image=$release" >> "$GITHUB_OUTPUT"
            echo "resume=false" >> "$GITHUB_OUTPUT"
          fi
      # A tag run pushes only a unique candidate. The immutable public release
      # tag is created after every gate below succeeds.
      - name: Build candidate fixed-profile image
        id: image
        if: startsWith(github.ref, 'refs/tags/v') && steps.image-plan.outputs.resume != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-plan.outputs.candidate_image }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            SSR_AUTH_ENABLED=true
            AUTH_PROVIDER=basic-auth
            OR3_GUEST_ACCESS_ENABLED=false
            OR3_AUTH_REGISTRATION_MODE=invite_only
            OR3_AUTH_AUTO_PROVISION=false
            OR3_SYNC_ENABLED=true
            OR3_SYNC_PROVIDER=sqlite
            OR3_STORAGE_ENABLED=true
            NUXT_PUBLIC_STORAGE_PROVIDER=fs
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build local amd64 image for dispatch qualification
        id: local-image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image-plan.outputs.qualifying_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          provenance: false
          sbom: false
          build-args: |
            SSR_AUTH_ENABLED=true
            AUTH_PROVIDER=basic-auth
            OR3_GUEST_ACCESS_ENABLED=false
            OR3_AUTH_REGISTRATION_MODE=invite_only
            OR3_AUTH_AUTO_PROVISION=false
            OR3_SYNC_ENABLED=true
            OR3_SYNC_PROVIDER=sqlite
            OR3_STORAGE_ENABLED=true
            NUXT_PUBLIC_STORAGE_PROVIDER=fs
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # After the multi-arch image is published (tag run), assert the manifest
      # list contains both linux/amd64 and linux/arm64.
      - name: Verify multi-arch manifest list
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OR3_IMAGE: ${{ steps.image-plan.outputs.qualifying_image }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$OR3_IMAGE")"
          echo "$inspect"
          grep -q 'linux/amd64' <<<"$inspect"
          grep -q 'linux/arm64' <<<"$inspect"
          echo "Multi-arch manifest verified for linux/amd64 and linux/arm64."
      - name: Verify anonymous GHCR pull
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OR3_IMAGE: ${{ steps.image-plan.outputs.qualifying_image }}
        run: |
          docker logout ghcr.io
          docker pull "$OR3_IMAGE"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both platforms must independently produce an SBOM, provenance, digest,
      # and a vulnerability report. scan-image.mjs is deliberately fail-closed.
      - name: Install Syft for release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        id: syft
        uses: anchore/sbom-action/download-syft@d8a2c0130026bf585de5c176ab8f7ce62d75bf04
        with:
          syft-version: v1.40.1
      - name: Install Trivy for release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
      - name: Scan linux/amd64 image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OR3_IMAGE: ${{ steps.image-plan.outputs.qualifying_image }}
        run: |
          node scripts/release/scan-image.mjs "$OR3_IMAGE" \
            --platform linux/amd64 --syft "${{ steps.syft.outputs.cmd }}" \
            --out release-evidence-amd64.json
      - name: Scan linux/arm64 image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OR3_IMAGE: ${{ steps.image-plan.outputs.qualifying_image }}
        run: |
          node scripts/release/scan-image.mjs "$OR3_IMAGE" \
            --platform linux/arm64 --syft "${{ steps.syft.outputs.cmd }}" \
            --out release-evidence-arm64.json
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: or3-cloud-release-evidence
          path: |
            release-evidence-*.json
            or3-sbom-*.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: or3-cloud-tarball
          path: ${{ steps.pack.outputs.tarball }}
      # Native amd64 operator journey: provision through the packed CLI, then
      # verify auth, SQLite sync, storage, and persistence across restart.
      - name: Smoke-test the qualifying image on amd64
        env:
          OR3_IMAGE: ${{ steps.image-plan.outputs.qualifying_image }}
        run: |
          smoke="$RUNNER_TEMP/or3-audit-cloud-smoke"
          OR3_CLOUD_TEST_IMAGE="$OR3_IMAGE" OR3_CLOUD_SKIP_PULL=true \
            npm exec --yes --package="${{ steps.pack.outputs.tarball }}" -- \
            or3 init "$smoke" --local --port 3017 --admin-email smoke@example.com
          for attempt in $(seq 1 120); do
            curl --fail --silent "http://127.0.0.1:3017/api/health?deep=true" && break
            sleep 1
          done
          curl --fail "http://127.0.0.1:3017/api/health?deep=true"
          (cd "$smoke" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" write)
          (cd "$smoke" && docker compose --env-file .env -f compose.yaml restart or3)
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://127.0.0.1:3017/api/health?deep=true" && break
            sleep 1
          done
          (cd "$smoke" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)
      # Clean-browser journey against the same running deployment, before teardown.
      - name: Clean-browser journey smoke
        run: |
          npx playwright install --with-deps chromium
          smoke="$RUNNER_TEMP/or3-audit-cloud-smoke"
          (cd "$smoke" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-browser.mjs")
      - name: Clean native smoke before arm64 qualification
        run: |
          smoke="$RUNNER_TEMP/or3-audit-cloud-smoke"
          if [ -d "$smoke" ]; then
            docker compose --project-directory "$smoke" --env-file "$smoke/.env" -f "$smoke/compose.yaml" down --volumes
          fi
      - name: Enable arm64 runtime emulation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      # Docker Desktop/BuildKit executes this real arm64 image under QEMU. It
      # deliberately goes through the same packed operator CLI and validates
      # the full auth/sync/storage persistence path across a restart.
      - name: Smoke-test the qualifying image on arm64
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OR3_IMAGE: ${{ steps.image-plan.outputs.qualifying_image }}
        run: |
          set -euo pipefail
          docker image rm "$OR3_IMAGE" 2>/dev/null || true
          smoke="$RUNNER_TEMP/or3-audit-cloud-arm64-smoke"
          DOCKER_DEFAULT_PLATFORM=linux/arm64 OR3_CLOUD_TEST_IMAGE="$OR3_IMAGE" \
            npm exec --yes --package="${{ steps.pack.outputs.tarball }}" -- \
            or3 init "$smoke" --local --port 3018 --admin-email arm64-smoke@example.com
          for attempt in $(seq 1 180); do
            curl --fail --silent "http://127.0.0.1:3018/api/health?deep=true" && break
            sleep 1
          done
          curl --fail "http://127.0.0.1:3018/api/health?deep=true"
          (cd "$smoke" && OR3_SMOKE_URL=http://127.0.0.1:3018 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" write)
          (cd "$smoke" && DOCKER_DEFAULT_PLATFORM=linux/arm64 docker compose --env-file .env -f compose.yaml restart or3)
          for attempt in $(seq 1 120); do
            curl --fail --silent "http://127.0.0.1:3018/api/health?deep=true" && break
            sleep 1
          done
          (cd "$smoke" && OR3_SMOKE_URL=http://127.0.0.1:3018 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)
      - name: Promote the fully qualified candidate to the immutable release tag
        id: release-digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_IMAGE: ${{ steps.image-plan.outputs.release_image }}
          CANDIDATE_IMAGE: ${{ steps.image-plan.outputs.candidate_image }}
          RESUME: ${{ steps.image-plan.outputs.resume }}
        run: |
          set -euo pipefail
          if [ "$RESUME" != true ]; then
            if docker manifest inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
              echo "Release tag $RELEASE_IMAGE appeared while qualifying; refusing to overwrite it."
              exit 1
            fi
            docker buildx imagetools create --tag "$RELEASE_IMAGE" "$CANDIDATE_IMAGE"
          fi
          digest="$(docker buildx imagetools inspect "$RELEASE_IMAGE" --format '{{.Index.Digest}}')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > digest.txt
          echo "Promoted and verified $RELEASE_IMAGE @ $digest"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: or3-cloud-image-digest
          path: digest.txt
      - if: always()
        name: Clean up release smoke deployment
        run: |
          smoke="$RUNNER_TEMP/or3-audit-cloud-smoke"
          if [ -d "$smoke" ]; then
            docker compose --project-directory "$smoke" --env-file "$smoke/.env" -f "$smoke/compose.yaml" down --volumes 2>/dev/null || true
          fi
          arm_smoke="$RUNNER_TEMP/or3-audit-cloud-arm64-smoke"
          if [ -d "$arm_smoke" ]; then
            docker compose --project-directory "$arm_smoke" --env-file "$arm_smoke/.env" -f "$arm_smoke/compose.yaml" down --volumes 2>/dev/null || true
          fi
      - if: always()
        name: Verify named smoke resources are gone
        run: |
          set -euo pipefail
          leftovers="$(
            {
              docker ps -aq --filter name='or3-audit-cloud-smoke' || true
              docker ps -aq --filter name='or3-audit-cloud-arm64-smoke' || true
            } | sed '/^$/d' | sort -u
          )"
          test -z "$leftovers" || { echo "Named smoke containers remain: $leftovers"; exit 1; }
          test ! -e "$RUNNER_TEMP/or3-audit-cloud-smoke"
          test ! -e "$RUNNER_TEMP/or3-audit-cloud-arm64-smoke"

  # ---------------------------------------------------------------------------
  # Job B "publish-npm" (tag-only): publishes ONLY the missing npm half.
  #
  # Before publishing it must:
  #   a. Verify the image for this version exists in GHCR AND its digest matches
  #      the digest produced in the qualify job (persisted as an artifact).
  #   b. If the image exists and identity is verified -> publish npm (resumable).
  #      If the image does NOT exist -> fail (never publish npm without image).
  #   c. If npm already exists -> fail ("version already published; choose a
  #      new version") -- never overwrite.
  # ---------------------------------------------------------------------------
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.2
      - name: Read release version
        id: version
        run: |
          version="$(node -p 'require("./packages/or3-cloud/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cloud version $version."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: or3-cloud-image-digest
          path: digest
      - uses: actions/download-artifact@v4
        with:
          name: or3-cloud-tarball
          path: tarball
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image exists and identity matches the qualified build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          recorded="$(tr -d '[:space:]' < digest/digest.txt)"
          test -n "$recorded" || { echo "No recorded image digest found; refusing to publish npm."; exit 1; }
          image="ghcr.io/saluana/or3-chat:$VERSION"
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Image $image does not exist; refusing to publish npm without the image."
            exit 1
          fi
          existing="$(docker buildx imagetools inspect "$image" --format '{{.Index.Digest}}')"
          if [ "$existing" != "$recorded" ]; then
            echo "Image digest mismatch for $image: existing=$existing recorded=$recorded"
            exit 1
          fi
          echo "Image identity verified: $image @ $existing"
      - name: Reject reused npm version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm_output="$(npm view "@or3/cloud@$VERSION" version 2>&1)" || npm_status=$?
          if [ "${npm_status:-0}" -eq 0 ]; then
            echo "@or3/cloud@$VERSION already published; choose a new version."
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found|not found' <<<"$npm_output"; then
            echo "$npm_output"
            exit "${npm_status}"
          fi
      - name: Publish @or3/cloud
        run: npm publish "$(find tarball -maxdepth 1 -name 'or3-cloud-*.tgz' -print -quit)" --access public
      - name: Verify exact npm and npx propagation
        run: |
          version="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 120); do
            if npm_config_prefer_online=true npm view "@or3/cloud@$version" version | grep -Fx "$version"; then
              if npm_config_prefer_online=true npx --yes "@or3/cloud@$version" --help; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "@or3/cloud@$version was not available after registry propagation retries."
          exit 1
