name: Release OR3 Cloud

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified image and @or3/cloud package
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  qualify:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11.6.2
      - name: Verify version contract
        run: bun run release:cloud:check
      - name: Read release version
        id: version
        run: |
          version="$(node -p 'require("./packages/or3-cloud/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify fixed-profile provider dependencies
        run: bun run scripts/release/check-cloud-package.mjs --registry
      - name: Build and test Cloud CLI
        run: bun run cloud:package:check
      - name: Pack Cloud CLI
        id: pack
        working-directory: packages/or3-cloud
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tarball="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'or3-cloud-*.tgz' -print -quit)"
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject reused release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm_output="$(npm view "@or3/cloud@$VERSION" version 2>&1)" || npm_status=$?
          if [ "${npm_status:-0}" -eq 0 ]; then
            echo "@or3/cloud@$VERSION already exists; choose a new version."
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found|not found' <<<"$npm_output"; then
            echo "$npm_output"
            exit "${npm_status}"
          fi
          image="ghcr.io/saluana/or3-chat:$VERSION"
          manifest_output="$(docker manifest inspect "$image" 2>&1)" || manifest_status=$?
          if [ "${manifest_status:-0}" -eq 0 ]; then
            echo "$image already exists; choose a new version."
            exit 1
          fi
          if ! grep -Eqi 'no such manifest|manifest unknown|not found|404' <<<"$manifest_output"; then
            echo "$manifest_output"
            exit "${manifest_status}"
          fi
      - name: Build and publish fixed-profile image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/saluana/or3-chat:${{ steps.version.outputs.version }}
          build-args: |
            SSR_AUTH_ENABLED=true
            AUTH_PROVIDER=basic-auth
            OR3_GUEST_ACCESS_ENABLED=false
            OR3_SYNC_ENABLED=true
            OR3_SYNC_PROVIDER=sqlite
            OR3_STORAGE_ENABLED=true
            NUXT_PUBLIC_STORAGE_PROVIDER=fs
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify anonymous GHCR pull
        env:
          OR3_IMAGE: ghcr.io/saluana/or3-chat:${{ steps.version.outputs.version }}
        run: |
          docker logout ghcr.io
          docker pull "$OR3_IMAGE"
      - name: Smoke-test the published image
        env:
          OR3_IMAGE: ghcr.io/saluana/or3-chat:${{ steps.version.outputs.version }}
        run: |
          smoke="$RUNNER_TEMP/or3-cloud-smoke"
          OR3_CLOUD_TEST_IMAGE="$OR3_IMAGE" OR3_CLOUD_SKIP_PULL=true \
            npm exec --yes --package="${{ steps.pack.outputs.tarball }}" -- \
            or3 init "$smoke" --local --port 3017 --admin-email smoke@example.com
          for attempt in $(seq 1 120); do
            curl --fail --silent "http://127.0.0.1:3017/api/health?deep=true" && break
            sleep 1
          done
          curl --fail "http://127.0.0.1:3017/api/health?deep=true"
          (cd "$smoke" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" write)
          (cd "$smoke" && docker compose --env-file .env -f compose.yaml restart or3)
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://127.0.0.1:3017/api/health?deep=true" && break
            sleep 1
          done
          (cd "$smoke" && OR3_SMOKE_URL=http://127.0.0.1:3017 node "$GITHUB_WORKSPACE/scripts/release/smoke-create-docker.mjs" verify)
          docker compose --project-directory "$smoke" --env-file "$smoke/.env" -f "$smoke/compose.yaml" down --volumes
      - name: Publish @or3/cloud
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        working-directory: packages/or3-cloud
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
      - name: Verify exact npm and npx propagation
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          version="${{ steps.version.outputs.version }}"
          for attempt in $(seq 1 120); do
            if npm_config_prefer_online=true npm view "@or3/cloud@$version" version | grep -Fx "$version"; then
              npm_config_prefer_online=true npx --yes "@or3/cloud@$version" --help
              exit 0
            fi
            sleep 2
          done
          echo "@or3/cloud@$version was not available after registry propagation retries."
          exit 1
      - if: always()
        name: Clean up release smoke deployment
        run: |
          smoke="$RUNNER_TEMP/or3-cloud-smoke"
          if [ -d "$smoke" ]; then
            docker compose --project-directory "$smoke" --env-file "$smoke/.env" -f "$smoke/compose.yaml" down --volumes 2>/dev/null || true
          fi
      - name: Write image digest
        if: always()
        run: echo "Published image digest ${{ steps.image.outputs.digest }}"
