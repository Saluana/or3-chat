services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      or3:
        condition: service_healthy
    environment:
      OR3_PUBLIC_DOMAIN: ${OR3_PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
    name: ${OR3_CADDY_DATA_VOLUME}
  caddy-config:
    name: ${OR3_CADDY_CONFIG_VOLUME}
